[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docbridge"
version = "0.2.0"
description = "Document parsing for AI agents: PDF, DOCX, HTML and images to clean Markdown and JSON, with first-class Thai and English support."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["document parsing", "pdf", "thai", "llm", "rag", "ai agents", "ocr"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Thai",
  "Natural Language :: English",
]
dependencies = [
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pythainlp>=5.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
# Liquid AI LFM3-VL-2B in-process (not needed if you run it via llama.cpp / vLLM)
vlm = ["transformers>=5.21.0", "torch", "torchvision", "pillow>=10.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "reportlab>=4.0", "fastapi>=0.110", "python-multipart>=0.0.9", "pytesseract>=0.3.10", "pillow>=10.0"]

[project.scripts]
docbridge = "docbridge.cli:main"

[tool.setuptools.packages.find]
include = ["docbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
